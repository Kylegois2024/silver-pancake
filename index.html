<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWC Staffing Solutions – Warehouse & Logistics Staffing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init({ publicKey: 'gyLSmTELTy9TaAXfx' });</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #261C11; --ink-mid: #382A1B; --ink-light: #6B5638;
      --signal: #C05621; --signal-light: #E08A54; --signal-pale: #F7E8DB;
      --white: #FFFDF8; --off-white: #F7F1E5;
      --gray-light: #E5DCCB; --gray-mid: #A2957F; --gray-dark: #5C5140; --text: #2B2216;
      --success: #3D6B35; --success-bg: #EAF1E4;
      --error: #A93226; --error-bg: #F9E9E6;
      --radius: 2px; --radius-sm: 2px;
      --shadow: 5px 5px 0 rgba(38,28,17,0.12); --shadow-lg: 8px 8px 0 rgba(38,28,17,0.16);
    }
    body { font-family: 'Work Sans', sans-serif; background: var(--off-white); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav { background: var(--off-white); padding: 0 48px; display: flex; align-items: center; justify-content: space-between; height: 76px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--ink); }
    .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .logo-mark { width: 44px; height: 44px; background: var(--ink); border-radius: 0; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 13px; font-weight: 600; color: var(--off-white); letter-spacing: 0.02em; }
    .logo-text strong { display: block; font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
    .logo-text span { font-size: 10px; color: var(--gray-dark); letter-spacing: 0.14em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 6px; }
    .nb { background: none; border: none; color: var(--gray-dark); font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 0; cursor: pointer; transition: all 0.15s; border-bottom: 2px solid transparent; }
    .nb:hover { color: var(--ink); border-bottom-color: var(--signal-light); }
    .nb.active { color: var(--ink); border-bottom-color: var(--signal); font-weight: 600; }
    .nb.cta { background: var(--signal); color: var(--white); font-weight: 600; margin-left: 12px; padding: 10px 20px; border-bottom: none; }
    .nb.cta:hover { background: var(--ink); color: var(--off-white); }

    /* BUTTONS */
    .btn-p { background: var(--signal); color: var(--white); border: none; border-radius: 0; padding: 15px 32px; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-p:hover { background: var(--signal-light); color: var(--ink); transform: translate(-2px,-2px); box-shadow: 4px 4px 0 rgba(38,28,17,0.35); }
    .btn-o { background: transparent; color: var(--off-white); border: 2px solid rgba(247,241,229,0.6); border-radius: 0; padding: 15px 32px; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-o:hover { background: var(--off-white); color: var(--ink); border-color: var(--off-white); }
    .hero .btn-o { color: var(--ink); border-color: var(--ink); }
    .hero .btn-o:hover { background: var(--ink); color: var(--off-white); }
    .btn-n { background: var(--ink); color: var(--off-white); border: none; border-radius: 0; padding: 13px 28px; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-n:hover { background: var(--signal); }
    .btn-sub { background: var(--signal); color: var(--white); border: none; border-radius: 0; padding: 14px 32px; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-sub:hover { background: var(--ink); }
    .btn-bk { background: none; border: 2px solid var(--gray-light); color: var(--gray-dark); font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 0; cursor: pointer; transition: all 0.15s; }
    .btn-bk:hover { border-color: var(--ink); color: var(--ink); }

    /* LAYOUT */
    .sec { padding: 96px 48px; }
    .inner { max-width: 1100px; margin: 0 auto; }
    .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--signal); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .lbl::before { content: ''; width: 28px; height: 2px; background: var(--signal); }
    .lbl-lt { color: var(--signal-light); }
    .lbl-lt::before { background: var(--signal-light); }
    .h1 { font-family: 'Fraunces', serif; font-size: clamp(32px, 4.2vw, 52px); font-weight: 600; color: var(--ink); line-height: 1.12; margin-bottom: 18px; letter-spacing: -0.01em; }
    .h1-lt { color: var(--off-white); }
    .sub { font-size: 17px; color: var(--gray-dark); line-height: 1.8; max-width: 620px; }
    .sub-lt { color: rgba(247,241,229,0.65); }
    .divider { height: 2px; background: var(--ink); margin: 0 48px; opacity: 0.08; }

    /* HERO */
    .hero { background: var(--off-white); padding: 96px 48px 88px; position: relative; overflow: hidden; border-bottom: 2px solid var(--ink); }
    .hero::before { content: ''; position: absolute; inset: 0; opacity: 0.4; background-image: radial-gradient(var(--gray-light) 1px, transparent 1px); background-size: 26px 26px; }
    .hero-grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 64px; align-items: center; position: relative; z-index: 1; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--ink); color: var(--ink); padding: 7px 16px; border-radius: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 26px; }
    .hero h1 { font-family: 'Fraunces', serif; font-size: clamp(40px, 5.4vw, 68px); font-weight: 600; color: var(--ink); line-height: 1.06; margin-bottom: 24px; letter-spacing: -0.015em; }
    .hero h1 em { color: var(--signal); font-style: italic; font-weight: 500; }
    .hero p { font-size: 18px; color: var(--gray-dark); max-width: 480px; margin: 0 0 38px; line-height: 1.75; }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid var(--ink); background: var(--white); box-shadow: var(--shadow-lg); }
    .hero-stats > div { padding: 30px 26px; border-right: 1.5px solid var(--gray-light); border-bottom: 1.5px solid var(--gray-light); }
    .hero-stats > div:nth-child(2n) { border-right: none; }
    .hero-stats > div:nth-child(n+3) { border-bottom: none; }
    .hs-num { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 600; color: var(--signal); line-height: 1; }
    .hs-lbl { font-size: 13px; color: var(--gray-dark); margin-top: 8px; }

    /* TRUST */
    .trust { background: var(--ink); padding: 18px 48px; display: flex; align-items: center; justify-content: center; gap: 44px; flex-wrap: wrap; }
    .ti { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(247,241,229,0.85); }
    .tdot { width: 8px; height: 8px; border-radius: 0; background: var(--signal-light); flex-shrink: 0; transform: rotate(45deg); }

    /* CARDS */
    .cards3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; margin-top: 48px; }
    .card { background: var(--white); border: 1.5px solid var(--ink); border-radius: 0; padding: 34px 28px; transition: all 0.15s; cursor: pointer; position: relative; }
    .card:hover { transform: translate(-4px,-4px); box-shadow: 7px 7px 0 var(--signal); }
    .card-icon { width: 52px; height: 52px; border-radius: 0; background: var(--signal-pale); border: 1.5px solid var(--signal); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 22px; }
    .card h3 { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
    .card p { font-size: 14px; color: var(--gray-dark); line-height: 1.7; }
    .card-link { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--signal); border-bottom: 1.5px solid var(--signal); padding-bottom: 1px; }

    /* GRID 2COL */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }

    /* ABOUT */
    .about-vis { background: var(--ink); border: 2px solid var(--ink); border-radius: 0; height: 420px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }
    .about-vis::before { content:''; position: absolute; inset:0; opacity:0.12; background-image: radial-gradient(var(--signal-light) 1px, transparent 1px); background-size:24px 24px; }
    .av-inner { text-align: center; position: relative; z-index: 1; }
    .av-year { font-family: 'Fraunces', serif; font-size: 92px; font-weight: 600; color: var(--signal-light); line-height: 1; display: block; font-style: italic; }
    .av-sub { font-size: 14px; color: rgba(247,241,229,0.6); letter-spacing: 0.1em; text-transform: uppercase; }
    .av-badge { position: absolute; bottom: -18px; right: -18px; background: var(--signal); border: 2px solid var(--ink); border-radius: 0; padding: 18px 24px; box-shadow: 5px 5px 0 rgba(38,28,17,0.25); }
    .av-badge strong { display: block; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; color: var(--white); }
    .av-badge span { font-size: 12px; color: var(--white); font-weight: 500; opacity: 0.85; }
    .vals { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
    .val { display: flex; gap: 13px; align-items: flex-start; }
    .val-check { width: 22px; height: 22px; border-radius: 0; background: var(--success-bg); border: 1.5px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; margin-top: 2px; color: var(--success); }
    .val strong { font-size: 14px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 2px; }
    .val span { font-size: 13px; color: var(--gray-dark); line-height: 1.6; }

    /* TEAM */
    .team-card { background: var(--white); border: 1.5px solid var(--ink); border-radius: 0; overflow: hidden; transition: all 0.15s; }
    .team-card:hover { transform: translate(-4px,-4px); box-shadow: 7px 7px 0 var(--signal); }
    .team-av { height: 160px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 52px; font-weight: 600; font-style: italic; }
    .team-info { padding: 20px 22px; }
    .team-info h4 { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
    .team-info .role { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--signal); font-weight: 600; margin: 5px 0 10px; }
    .team-info p { font-size: 13px; color: var(--gray-dark); line-height: 1.7; }

    /* POLICE CHECK */
    .pc-hero { background: var(--ink); padding: 76px 48px; border-bottom: 4px solid var(--signal); }
    .pc-hi { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
    .pc-hi h2 { font-family: 'Fraunces', serif; font-size: clamp(30px,4vw,46px); font-weight: 600; color: var(--off-white); margin-bottom: 14px; }
    .pc-hi > div > p { font-size: 15px; color: rgba(247,241,229,0.6); line-height: 1.7; margin-bottom: 26px; }
    .pc-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pc-pill { background: transparent; border: 1.5px solid rgba(247,241,229,0.3); color: rgba(247,241,229,0.85); padding: 6px 14px; border-radius: 0; font-size: 12px; font-weight: 500; }
    .pc-card { background: var(--white); border: 2px solid var(--ink); border-radius: 0; padding: 32px; box-shadow: 8px 8px 0 var(--signal); }
    .pc-card h3 { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
    .pc-card > p { font-size: 14px; color: var(--gray-dark); margin-bottom: 22px; }
    .pc-steps { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .pc-step { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--gray-dark); }
    .pc-sn { width: 26px; height: 26px; border-radius: 0; background: var(--signal-pale); border: 1.5px solid var(--signal); color: var(--signal); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* TABS */
    .tabs { background: var(--off-white); border-bottom: 2px solid var(--ink); padding: 0 48px; display: flex; }
    .tab-btn { background: none; border: none; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 600; padding: 17px 22px; cursor: pointer; color: var(--gray-mid); border-bottom: 3px solid transparent; transition: all 0.15s; margin-bottom: -2px; }
    .tab-btn.active { color: var(--ink); border-bottom-color: var(--signal); }
    .tab-btn:hover:not(.active) { color: var(--gray-dark); }

    /* FORM */
    .form-wrap { background: var(--white); border: 2px solid var(--ink); border-radius: 0; box-shadow: var(--shadow-lg); overflow: hidden; margin-top: 40px; }
    .form-hdr { background: var(--ink); padding: 26px 32px; display: flex; align-items: center; justify-content: space-between; }
    .form-hdr h3 { font-family: 'Fraunces', serif; color: var(--off-white); font-size: 19px; font-weight: 600; }
    .form-hdr p { color: var(--gray-mid); font-size: 13px; margin-top: 3px; }
    .prog { display: flex; gap: 6px; }
    .prog-pip { height: 5px; width: 34px; border-radius: 0; background: rgba(247,241,229,0.18); transition: background 0.3s; }
    .prog-pip.done { background: var(--signal); }
    .prog-pip.active { background: var(--signal-light); }
    .form-body { padding: 32px; }
    .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .fg-full { grid-column: 1 / -1; }
    .fgrp { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 13px; font-weight: 600; color: var(--ink); }
    label .req { color: var(--error); }
    input, select, textarea { font-family: 'Work Sans', sans-serif; font-size: 14px; padding: 11px 14px; border: 1.5px solid var(--gray-light); border-radius: 0; background: var(--off-white); color: var(--text); transition: all 0.15s; outline: none; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--ink); background: var(--white); box-shadow: 3px 3px 0 var(--signal-pale); }
    input.ferr-i { border-color: var(--error); }
    .ferr { font-size: 12px; color: var(--error); }
    textarea { resize: vertical; min-height: 80px; }
    .info-b { background: var(--signal-pale); border: 1.5px solid var(--signal); border-radius: 0; padding: 12px 14px; font-size: 13px; color: var(--ink); margin-bottom: 22px; }
    .upload-z { border: 2px dashed var(--gray-mid); border-radius: 0; padding: 32px; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--off-white); }
    .upload-z:hover, .upload-z.drag { border-color: var(--signal); background: var(--signal-pale); }
    .upload-z h4 { font-size: 15px; font-weight: 600; color: var(--ink); margin: 10px 0 5px; }
    .upload-z p { font-size: 13px; color: var(--gray-mid); }
    .upload-z input { display: none; }
    .up-file { display: flex; align-items: center; justify-content: space-between; background: var(--success-bg); border: 1.5px solid var(--success); border-radius: 0; padding: 11px 14px; margin-top: 10px; }
    .up-file span { font-size: 13px; color: var(--success); font-weight: 500; }
    .up-rem { background: none; border: none; color: var(--error); cursor: pointer; font-size: 17px; }
    .consent-b { background: var(--signal-pale); border: 1.5px solid var(--signal); border-radius: 0; padding: 22px; margin-top: 18px; }
    .consent-b h4 { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
    .consent-b > p { font-size: 13px; color: var(--gray-dark); line-height: 1.7; margin-bottom: 14px; }
    .chk-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .chk-row input[type=checkbox] { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--signal); flex-shrink: 0; }
    .chk-row label { font-size: 13px; font-weight: 400; color: var(--gray-dark); cursor: pointer; }
    .form-nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; border-top: 2px solid var(--ink); background: var(--off-white); }

    /* STATUS */
    .status-search { background: var(--white); border: 1.5px solid var(--ink); border-radius: 0; padding: 26px; display: flex; gap: 12px; align-items: flex-end; margin-top: 32px; }
    .status-res { background: var(--white); border: 1.5px solid var(--ink); border-radius: 0; padding: 26px; margin-top: 18px; }
    .tl-item { display: flex; gap: 14px; margin-bottom: 22px; }
    .tl-dot { width: 15px; height: 15px; border-radius: 0; transform: rotate(45deg); flex-shrink: 0; margin-top: 3px; position: relative; }
    .tl-dot::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%) rotate(-45deg); width: 2px; height: 26px; background: var(--gray-light); }
    .tl-item:last-child .tl-dot::after { display: none; }
    .tl-dot.done { background: var(--success); }
    .tl-dot.active { background: var(--signal); box-shadow: 0 0 0 4px var(--signal-pale); }
    .tl-dot.pend { background: var(--gray-light); }
    .tl-txt h4 { font-size: 14px; font-weight: 600; }
    .tl-txt p { font-size: 13px; color: var(--gray-mid); margin-top: 2px; }
    .sbadge { display: inline-block; padding: 4px 11px; border-radius: 0; border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .sbadge.complete { background: var(--success-bg); color: var(--success); }
    .sbadge.processing { background: #F7EBD0; color: #8A6210; }
    .sbadge.pending { background: var(--gray-light); color: var(--gray-dark); }

    /* ADMIN */
    .adm-bar { background: var(--ink); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
    .adm-bar h2 { font-family: 'Fraunces', serif; color: var(--off-white); font-size: 19px; font-weight: 600; }
    .adm-bar span { color: var(--gray-mid); font-size: 13px; }
    .adm-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; padding: 24px 32px; }
    .stat-c { background: var(--white); border: 1.5px solid var(--ink); border-radius: 0; padding: 20px; }
    .stat-c .sn { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; color: var(--ink); }
    .stat-c .sl { font-size: 13px; color: var(--gray-mid); margin-top: 3px; }
    .stat-c .sd { font-size: 12px; font-weight: 600; margin-top: 5px; color: var(--success); }
    .tbl-wrap { padding: 0 32px 32px; }
    .tbl-ctrl { display: flex; gap: 10px; margin-bottom: 12px; }
    .ts { flex: 1; max-width: 280px; padding: 9px 13px; border: 1.5px solid var(--gray-light); border-radius: 0; font-family: 'Work Sans', sans-serif; font-size: 14px; outline: none; }
    .tf { padding: 9px 13px; border: 1.5px solid var(--gray-light); border-radius: 0; font-family: 'Work Sans', sans-serif; font-size: 14px; background: var(--white); cursor: pointer; outline: none; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px 13px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gray-dark); border-bottom: 2px solid var(--ink); background: var(--off-white); }
    td { padding: 12px 13px; border-bottom: 1px solid var(--gray-light); vertical-align: middle; }
    tr:hover td { background: var(--signal-pale); }
    .abtn { background: none; border: 1.5px solid var(--gray-light); border-radius: 0; padding: 5px 11px; font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink); transition: all 0.15s; }
    .abtn:hover { background: var(--ink); color: var(--off-white); border-color: var(--ink); }

    /* CONTACT */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; margin-top: 48px; }
    .ci { display: flex; gap: 14px; align-items: flex-start; }
    .ci-icon { width: 44px; height: 44px; border-radius: 0; background: var(--signal-pale); border: 1.5px solid var(--signal); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .ci strong { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .ci p { font-size: 13px; color: var(--gray-dark); line-height: 1.6; }
    .cf { background: var(--white); border: 2px solid var(--ink); border-radius: 0; padding: 32px; box-shadow: var(--shadow); }
    .cf h3 { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600; color: var(--ink); margin-bottom: 22px; }

    /* SUCCESS */
    .success-sc { text-align: center; padding: 72px 40px; max-width: 500px; margin: 0 auto; }

/*

 * Reference numbers double as upload-folder names and tracker lookup keys,
 * so they must be unguessable. This uses crypto.getRandomValues (~40 bits
 * of entropy) instead of a small sequential/random number.
 */
const genRef = () => {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = new Uint32Array(8);
  crypto.getRandomValues(buf);
  let s = '';
  for (let i = 0; i < 8; i++) s += chars[buf[i] % chars.length];
  return `SWC-${new Date().getFullYear()}-${s}`;
};

function Jobs({ setPage }) {
  const [done, setDone] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [submitErr, setSubmitErr] = useState('');
  const [form, setForm] = useState({
    firstName:'', middleName:'', lastName:'', dob:'', gender:'',
    email:'', phone:'', address:'', suburb:'', state:'', postcode:'',
    preferredCity:'', workType:'',
  });
  const [errs, setErrs] = useState({});
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));

  const validate = () => {
    const e = {};
    if(!form.firstName.trim()) e.firstName = 'Required';
    if(!form.lastName.trim()) e.lastName = 'Required';
    if(!form.dob) e.dob = 'Required';
    if(!form.email.includes('@')) e.email = 'Valid email required';
    if(!form.phone.trim()) e.phone = 'Required';
    if(!form.address.trim()) e.address = 'Required';
    if(!form.suburb.trim()) e.suburb = 'Required';
    if(!form.state) e.state = 'Required';
    if(!form.postcode.trim()) e.postcode = 'Required';
    if(!form.preferredCity) e.preferredCity = 'Required';
    if(!form.workType) e.workType = 'Required';
    setErrs(e);
    return Object.keys(e).length === 0;
  };

  const submit = async () => {
    if(!validate()) return;
    setSubmitting(true);
    setSubmitErr('');
    try {
      await sb.insert('job_applications', {
        first_name: form.firstName,
        middle_name: form.middleName,
        last_name: form.lastName,
        dob: form.dob,
        gender: form.gender,
        email: form.email,
        phone: form.phone,
        address: form.address,
        suburb: form.suburb,
        state: form.state,
        postcode: form.postcode,
        preferred_city: form.preferredCity,
        work_type: form.workType,
        status: 'new',
      });
      // Send email notification
      try {
        await emailjs.send('personnelstaffingaus', 'template_w3e2d1k', {
          name: `${form.firstName} ${form.middleName} ${form.lastName}`.trim(),
          email: form.email,
          phone: form.phone,
          city: form.preferredCity,
          work_type: form.workType,
        });
      } catch(emailErr) { console.warn('Email notification failed:', emailErr); }

      setDone(true);
    } catch(err) {
      console.error(err);
      setSubmitErr('Something went wrong. Please try again or call us on 0470 632 701.');
    } finally {
      setSubmitting(false);
    }
  };

  if(done) return (
    <div className="success-sc" style={{paddingTop:80}}>
      <div className="s-icon">✓</div>
      <h2>Application Received!</h2>
      <p>Thanks for your interest in working with SWC Staffing Solutions. We'll be in touch as soon as a suitable role becomes available.</p>
      <p style={{marginTop:8}}>In the meantime, if you have any questions call us on <strong>0470 632 701</strong>.</p>
      <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap',marginTop:28}}>
        <button className="btn-n" onClick={()=>{setDone(false);setForm({firstName:'',middleName:'',lastName:'',dob:'',gender:'',email:'',phone:'',address:'',suburb:'',state:'',postcode:'',preferredCity:'',workType:''});}}>Submit Another</button>
        <button className="btn-bk" onClick={()=>setPage('home')}>Return Home</button>
      </div>
    </div>
  );

  return (<>
    <div className="sec" style={{background:'var(--ink)',paddingBottom:64}}>
      <div className="inner">
        <div className="lbl lbl-lt">Work With Us</div>
        <div className="h1 h1-lt">Register Your Interest</div>
        <p className="sub sub-lt">We place workers in warehouses across Australia. Fill in your details below and we'll be in touch when a role that suits you becomes available.</p>
      </div>
    </div>

    <div className="sec" style={{background:'var(--white)'}}>
      <div className="inner" style={{maxWidth:780}}>
        <div className="form-wrap">
          <div className="form-hdr">
            <div>
              <h3>Job Interest Form</h3>
              <p>All fields marked * are required. Your details are kept private and secure.</p>
            </div>
          </div>
          <div className="form-body">
            <div className="info-b">ℹ️ Enter your details exactly as they appear on your ID. We'll contact you when a suitable role is available.</div>

            <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:14}}>Personal Details</div>
            <div className="fg" style={{marginBottom:20}}>
              <div className="fgrp"><label>First Name <span className="req">*</span></label><input value={form.firstName} onChange={e=>upd('firstName',e.target.value)} className={errs.firstName?'ferr-i':''}/>{errs.firstName&&<span className="ferr">{errs.firstName}</span>}</div>

 * The anon (publishable) key below is DESIGNED to be public — but it is only

 *   - anon may only INSERT into applications / job_applications and only
 *     UPLOAD to the id-documents bucket (never read, list, or modify)
 *   - reads and status updates require a signed-in Supabase Auth staff user
 *   - the public tracker uses the track_application() RPC, which returns
 *     only reference, name, status, site, and submission date
 */
const SUPA_URL = 'https://hcwbseetqgowwvdvdpkz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjd2JzZWV0cWdvd3d2ZHZkcGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTgwMjIsImV4cCI6MjA5MDI3NDAyMn0.k3ROFEBN85f8tYLQ3JLiZKYHnDwfe6QUC2-yz_EQTQ8';

const sbError = async (r) => {
  const e = new Error(await r.text().catch(()=>String(r.status)));
  e.status = r.status;
  return e;
};

const sb = {
  // Anonymous insert. return=minimal is required: anon has no SELECT
  // privilege, so asking PostgREST to return the inserted row would fail.
  async insert(table, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal'},
      body: JSON.stringify(data)
    });
    if(!r.ok) throw await sbError(r);
  },
  // Staff-only read: pass the Supabase Auth access token.
  async select(table, query='', token) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${query}&order=created_at.desc`, {
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${token||SUPA_KEY}`}
    });
    if(!r.ok) throw await sbError(r);
    return r.json();
  },
  // Staff-only update: pass the Supabase Auth access token.
  async update(table, match, data, token) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${match}`, {
      method:'PATCH', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${token||SUPA_KEY}`,'Prefer':'return=minimal'},
      body: JSON.stringify(data)
    });
    if(!r.ok) throw await sbError(r);
  },
  // Public RPC (SECURITY DEFINER function exposing only safe columns).
  async rpc(fn, args) {
    const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`},
      body: JSON.stringify(args)
    });
    if(!r.ok) throw await sbError(r);
    return r.json();
  },
  // Supabase Auth email/password sign-in (staff accounts managed in the
  // Supabase Dashboard → Authentication). Returns { access_token, ... }.
  async signIn(email, password) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body: JSON.stringify({email, password})
    });
    if(!r.ok) throw await sbError(r);
    return r.json();
  },
  // Anonymous upload to the private id-documents bucket (insert-only policy).
  async uploadFile(bucket, path, file) {
    const r = await fetch(`${SUPA_URL}/storage/v1/object/${bucket}/${path}`, {
      method:'POST', headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Content-Type':file.type},
      body: file
    });
    if(!r.ok) throw await sbError(r);
  },
  // Staff-only: create a short-lived signed URL for a private object.
  async signUrl(bucket, path, token, expiresIn=600) {
    const r = await fetch(`${SUPA_URL}/storage/v1/object/sign/${bucket}/${path}`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${token}`},
      body: JSON.stringify({expiresIn})
    });
    if(!r.ok) throw await sbError(r);
    const j = await r.json();
    return `${SUPA_URL}/storage/v1${j.signedURL}`;
  }
};

  const [errs,setErrs]=useState({});
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));

  const validate=()=>{
    const e={};
    if(step===0){if(!form.firstName.trim())e.firstName='Required';if(!form.lastName.trim())e.lastName='Required';if(!form.dob)e.dob='Required';if(!form.email.includes('@'))e.email='Valid email required';if(!form.phone.trim())e.phone='Required';}
    if(step===1){if(!form.address.trim())e.address='Required';if(!form.suburb.trim())e.suburb='Required';if(!form.state)e.state='Required';if(!form.postcode.trim())e.postcode='Required';}

    if(step===3){if(!form.c1||!form.c2||!form.c3)e.consent='All declarations required';}

  };
  const next=()=>{if(validate())setStep(s=>s+1);};
  const back=()=>setStep(s=>s-1);
  const handleFile=(key,file)=>{if(file)setFiles(f=>({...f,[key]:file}));};

  const submit = async () => {
    if(!validate()) return;
    setSubmitting(true);
    setSubmitErr('');
    try {
      const reference = genRef();
      // Upload ID documents to Supabase Storage (private bucket; the
      // random reference makes the folder path unguessable)
      const uploadFile = async (file, label) => {
        const ext = file.name.split('.').pop();
        const path = `${reference}/${label}.${ext}`;
        await sb.uploadFile('id-documents', path, file);
        return path;

      const selfiePath = await uploadFile(files.selfie, 'selfie-with-licence');
      const licenceFrontPath = await uploadFile(files.licenceFront, 'licence-front');
      const licenceBackPath = await uploadFile(files.licenceBack, 'licence-back');
      const secondaryFrontPath = await uploadFile(files.secondaryFront, 'secondary-front');
      const secondaryBackPath = files.secondaryBack ? await uploadFile(files.secondaryBack, 'secondary-back') : null;

      await sb.insert('applications', {
        first_name: form.firstName,

        last_name: form.lastName,
        dob: form.dob,
        email: form.email,
        phone: form.phone,
        gender: form.gender,
        address: form.address,
        suburb: form.suburb,
        state: form.state,
        postcode: form.postcode,
        prev_address: form.prevAddress,
        site: form.site,
        start_date: form.startDate,

        status: 'pending',
        primary_id_path: licenceFrontPath,
        secondary_id_path: secondaryFrontPath,
        selfie_path: selfiePath,
        licence_back_path: licenceBackPath,
        secondary_back_path: secondaryBackPath,
      });

      setSubmittedRef(reference);

      // Send email notification
      try {
        await emailjs.send('personnelstaffingaus', 'template_s7758nl', {
          name: `${form.firstName} ${form.middleName} ${form.lastName}`.trim(),
          email: form.email,
          phone: form.phone,
          reference: reference,
          site: form.site || 'Not specified',

      } catch(emailErr) { console.warn('Email notification failed:', emailErr); }

      setDone(true);
    } catch(err) {
      console.error(err);
      setSubmitErr('Something went wrong submitting your application. Please try again or contact us on 0470 632 701.');
    } finally {
      setSubmitting(false);
    }
  };

                {errs[key]&&<span className="ferr">{errs[key]}</span>}
              </div>
            ))}
          </div>
        </>}
        {step===3 && <>
          <div className="info-b">ℹ️ Please review your details and agree to all declarations before submitting.</div>
          <div style={{background:'var(--off-white)',border:'1px solid var(--gray-light)',borderRadius:'var(--radius)',padding:18,marginBottom:18}}>
            <h4 style={{fontWeight:700,marginBottom:10,fontSize:14}}>Application Summary</h4>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'7px 22px',fontSize:14}}>
              <span style={{color:'var(--gray-mid)'}}>Name</span><strong>{form.firstName} {form.middleName} {form.lastName}</strong>
              <span style={{color:'var(--gray-mid)'}}>DOB</span><strong>{form.dob}</strong>
              <span style={{color:'var(--gray-mid)'}}>Email</span><strong>{form.email}</strong>
              <span style={{color:'var(--gray-mid)'}}>Site</span><strong>{form.site||'Not specified'}</strong>
              <span style={{color:'var(--gray-mid)'}}>Selfie w/ Licence</span><strong>{files.selfie?.name||'—'}</strong>
              <span style={{color:'var(--gray-mid)'}}>Licence Front</span><strong>{files.licenceFront?.name||'—'}</strong>
              <span style={{color:'var(--gray-mid)'}}>Licence Back</span><strong>{files.licenceBack?.name||'—'}</strong>
              <span style={{color:'var(--gray-mid)'}}>Secondary ID</span><strong>{files.secondaryFront?.name||'—'}</strong>
            </div>
          </div>
          <div className="consent-b">
            <h4>Consent &amp; Declaration</h4>
            <p>By submitting, you consent to SWC Staffing Solutions conducting a National Police Check in accordance with ACIC requirements and the Privacy Act 1988 (Cth).</p>
            {[['c1','I confirm all information provided is true and correct to the best of my knowledge.'],['c2','I consent to SWC Staffing Solutions collecting, using, and disclosing my personal information for the purpose of conducting a National Police Check as outlined in the Privacy Policy.'],['c3','I understand results may be shared with my prospective employer as authorised under the Privacy Act 1988.']].map(([k,t])=>(
              <div className="chk-row" key={k}><input type="checkbox" id={k} checked={form[k]} onChange={e=>upd(k,e.target.checked)}/><label htmlFor={k}>{t}</label></div>
            ))}
            {errs.consent&&<span className="ferr" style={{display:'block',marginTop:8}}>{errs.consent}</span>}
          </div>
          {submitErr&&<div style={{background:'var(--error-bg)',border:'1px solid #F5C6CB',borderRadius:'var(--radius-sm)',padding:14,marginTop:16,color:'var(--error)',fontSize:13}}>{submitErr}</div>}
        </>}
      </div>
      <div className="form-nav">
        {step>0?<button className="btn-bk" onClick={back} disabled={submitting}>← Back</button>:<span/>}
        {step<3
          ?<button className="btn-n" onClick={next}>Continue →</button>
          :<button className="btn-sub" onClick={submit} disabled={submitting} style={{opacity:submitting?0.7:1}}>
            {submitting?'Uploading & Submitting…':'Submit Application ✓'}
          </button>
        }
      </div>
    </div>
  );
}

/* ── TRACKER ──
 * Uses the track_application() RPC instead of a table SELECT. The anon key
 * can no longer read the applications table; the RPC returns only safe
 * fields (reference, name, status, site, created_at).
 */
function Tracker() {
  const [q,setQ]=useState('');
  const [res,setRes]=useState(null);
  const [nf,setNf]=useState(false);
  const [loading,setLoading]=useState(false);

  const search = async () => {
    if(!q.trim()) return;
    setLoading(true); setNf(false); setRes(null);
    try {
      const data = await sb.rpc('track_application', { ref: q.trim().toUpperCase() });
      if(data && data.length>0) { setRes(data[0]); setNf(false); }
      else setNf(true);
    } catch(e) { setNf(true); }
    finally { setLoading(false); }
  };

  const tl=(status)=>[
    {l:'Application Received',d:'Your application and ID documents have been received.',s:'done'},
    {l:'Identity Verified',d:'Your ID documents are being checked.',s:status==='pending'?'pend':'done'},
    {l:'Check in Progress',d:'Your check is being processed with the ACIC database.',s:status==='complete'?'done':status==='processing'?'active':'pend'},
    {l:'Results Ready',d:'Your National Police Certificate has been issued.',s:status==='complete'?'done':'pend'},
  ];

  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-AU') : '—';

  return (
    <div style={{maxWidth:620}}>
      <h3 style={{fontSize:20,fontWeight:700,color:'var(--ink)',marginBottom:8}}>Track Your Application</h3>
      <p style={{color:'var(--gray-dark)',fontSize:14,marginBottom:22}}>Enter your reference number to check your live application status.</p>
      <div className="status-search">
        <div className="fgrp" style={{flex:1}}><label>Reference Number</label><input value={q} onChange={e=>setQ(e.target.value)} placeholder="e.g. SWC-2026-K7PMQ2XA" onKeyDown={e=>e.key==='Enter'&&search()}/></div>
        <button className="btn-n" onClick={search} disabled={loading}>{loading?'Searching…':'Search'}</button>
      </div>
      {nf&&<div style={{background:'var(--error-bg)',border:'1px solid #F5C6CB',borderRadius:'var(--radius)',padding:18,marginTop:18,color:'var(--error)',fontSize:14}}>No application found with that reference number. Please check and try again.</div>}
      {res&&(
        <div className="status-res">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:22}}>
            <div>
              <h3 style={{fontSize:18,fontWeight:700,color:'var(--ink)'}}>{res.first_name} {res.last_name}</h3>
              <p style={{fontSize:13,color:'var(--gray-mid)',marginTop:3}}>Ref: {res.reference} · Submitted {fmtDate(res.created_at)} · {res.site||'No site'}</p>
            </div>
            <span className={`sbadge ${res.status}`}>{res.status==='complete'?'Complete':res.status==='processing'?'In Progress':'Pending'}</span>
          </div>
          {tl(res.status).map((t,i)=>(
            <div className="tl-item" key={i}>
              <div className={`tl-dot ${t.s}`}/>
              <div className="tl-txt"><h4 style={{color:t.s==='pend'?'var(--gray-mid)':'var(--ink)'}}>{t.l}</h4><p>{t.d}</p></div>
            </div>
          ))}
          {res.status==='complete'&&<div style={{background:'var(--success-bg)',border:'1px solid #B2DFCC',borderRadius:'var(--radius)',padding:14,marginTop:10}}><strong style={{color:'var(--success)',fontSize:13}}>✓ Your National Police Certificate has been issued. Contact Seth on 0470 632 701 to receive your copy.</strong></div>}
        </div>
      )}
    </div>
  );
}

/* ── ADMIN ──
 * Real authentication via Supabase Auth. No password lives in this file.
 * Staff accounts are created in Supabase Dashboard → Authentication → Users.
 * The session access token (kept in memory only, never persisted) is what
 * unlocks SELECT / UPDATE via RLS and signed URLs for ID documents.
 */
function AdminDash() {
  const [token,setToken]=useState(null);
  const [staffEmail,setStaffEmail]=useState('');
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [authErr,setAuthErr]=useState('');
  const [authing,setAuthing]=useState(false);
  const [sq,setSq]=useState('');
  const [sf,setSf]=useState('all');
  const [apps,setApps]=useState([]);
  const [loading,setLoading]=useState(false);
  const [selected,setSelected]=useState(null);
  const [docUrls,setDocUrls]=useState({});
  const [docsLoading,setDocsLoading]=useState(false);
  const [updating,setUpdating]=useState(false);

  const sessionExpired = () => {
    setToken(null); setApps([]); setSelected(null);
    setAuthErr('Your session has expired. Please log in again.');
  };

  const login = async () => {
    if(!email.trim() || !pw) { setAuthErr('Enter your email and password.'); return; }
    setAuthing(true); setAuthErr('');
    try {
      const session = await sb.signIn(email.trim(), pw);
      setToken(session.access_token);
      setStaffEmail(email.trim());
      setPw('');
      await loadApps(session.access_token);
    } catch(e) {
      setAuthErr('Login failed. Check your email and password.');
    } finally {
      setAuthing(false);
    }
  };

  const logout = () => {
    setToken(null); setStaffEmail(''); setApps([]); setSelected(null); setAuthErr('');
  };

  const loadApps = async (t) => {
    setLoading(true);
    try {
      const data = await sb.select('applications','select=*', t||token);
      setApps(data||[]);
    } catch(e) {
      console.error(e);
      if(e.status===401) sessionExpired();
    } finally { setLoading(false); }
  };

  const updateStatus = async (id, status) => {
    setUpdating(true);
    try {
      await sb.update('applications', `id=eq.${id}`, {status}, token);
      setApps(prev=>prev.map(a=>a.id===id?{...a,status}:a));
      setSelected(s=>s && s.id===id ? {...s,status} : s);
    } catch(e) {
      if(e.status===401) sessionExpired();
      else alert('Failed to update status.');
    } finally { setUpdating(false); }
  };

  // Open an application and fetch short-lived signed URLs for its documents.
  const openDetails = async (a) => {
    setSelected(a); setDocUrls({}); setDocsLoading(true);
    const docs = [
      ['Selfie w/ Licence', a.selfie_path],
      ['Licence Front', a.primary_id_path],
      ['Licence Back', a.licence_back_path],
      ['Secondary ID Front', a.secondary_id_path],
      ['Secondary ID Back', a.secondary_back_path],
    ];
    const urls = {};
    for(const [label, path] of docs) {
      if(path) {
        try { urls[label] = await sb.signUrl('id-documents', path, token); }
        catch(e) { console.error('Signed URL failed for', label, e); if(e.status===401){ sessionExpired(); setDocsLoading(false); return; } }
      }
    }
    setDocUrls(urls);
    setDocsLoading(false);
  };

  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-AU') : '—';

  if(!token) return (
    <div style={{maxWidth:360}}>
      <h3 style={{fontSize:19,fontWeight:700,color:'var(--ink)',marginBottom:6}}>Admin Login</h3>
      <p style={{fontSize:14,color:'var(--gray-dark)',marginBottom:22}}>Staff access only. Sign in with your SWC Staffing Solutions staff account.</p>
      <div className="fgrp" style={{marginBottom:14}}>
        <label>Email</label>
        <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setAuthErr('');}} placeholder="you@swcstaffingsolutions.com.au" autoComplete="username"/>
      </div>
      <div className="fgrp" style={{marginBottom:14}}>
        <label>Password</label>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setAuthErr('');}} placeholder="Password" autoComplete="current-password"
          onKeyDown={e=>e.key==='Enter'&&!authing&&login()}/>
        {authErr&&<span className="ferr">{authErr}</span>}
      </div>
      <button className="btn-n" style={{width:'100%',opacity:authing?0.7:1}} onClick={login} disabled={authing}>{authing?'Signing in…':'Login →'}</button>
      <p style={{fontSize:12,color:'var(--gray-mid)',marginTop:14,lineHeight:1.6}}>Forgotten your password or need an account? Contact your administrator — staff accounts are managed centrally.</p>
    </div>
  );

  const filtered=apps.filter(a=>{
    const mq=(a.first_name+' '+a.last_name).toLowerCase().includes(sq.toLowerCase())||a.reference?.toLowerCase().includes(sq.toLowerCase());
    const mf=sf==='all'||a.status===sf;
    return mq&&mf;
  });
  const cnt={total:apps.length,complete:apps.filter(a=>a.status==='complete').length,processing:apps.filter(a=>a.status==='processing').length,pending:apps.filter(a=>a.status==='pending').length};

  return (
    <div style={{background:'var(--white)',border:'1px solid var(--gray-light)',borderRadius:6,overflow:'hidden'}}>
      {selected && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
          <div style={{background:'var(--white)',borderRadius:6,padding:32,maxWidth:560,width:'100%',maxHeight:'80vh',overflowY:'auto',position:'relative'}}>
            <button onClick={()=>setSelected(null)} style={{position:'absolute',top:16,right:16,background:'none',border:'none',fontSize:22,cursor:'pointer',color:'var(--gray-mid)'}}>×</button>
            <h3 style={{fontSize:19,fontWeight:700,color:'var(--ink)',marginBottom:4}}>{selected.first_name} {selected.last_name}</h3>
            <p style={{fontSize:13,color:'var(--gray-mid)',marginBottom:20}}>Ref: {selected.reference} · Submitted {fmtDate(selected.created_at)}</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 20px',fontSize:14,marginBottom:20}}>
              {[['DOB',selected.dob],['Email',selected.email],['Phone',selected.phone],['Gender',selected.gender||'Not specified'],['Address',`${selected.address}, ${selected.suburb} ${selected.state} ${selected.postcode}`],['Site',selected.site||'Not specified'],['Start Date',selected.start_date||'Not specified']].map(([l,v])=>(
                <React.Fragment key={l}><span style={{color:'var(--gray-mid)',fontWeight:600}}>{l}</span><span>{v}</span></React.Fragment>
              ))}
            </div>
            <div style={{borderTop:'1px solid var(--gray-light)',paddingTop:16,marginBottom:16}}>
              <h4 style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:12,textTransform:'uppercase',letterSpacing:'0.05em'}}>ID Documents</h4>
              {docsLoading && <div style={{fontSize:13,color:'var(--gray-mid)',marginBottom:8}}>Generating secure links…</div>}
              {!docsLoading && [['Selfie w/ Licence',selected.selfie_path],['Licence Front',selected.primary_id_path],['Licence Back',selected.licence_back_path],['Secondary ID Front',selected.secondary_id_path],['Secondary ID Back',selected.secondary_back_path]].map(([l,path])=>(
                path
                  ? (docUrls[l]
                      ? <div key={l} style={{marginBottom:8}}><a href={docUrls[l]} target="_blank" rel="noopener noreferrer" style={{color:'var(--ink-light)',fontWeight:600,fontSize:14}}>📄 View {l}</a> <span style={{fontSize:11,color:'var(--gray-mid)'}}>(secure link, expires in 10 min)</span></div>
                      : <div key={l} style={{fontSize:13,color:'var(--gray-mid)',marginBottom:6}}>{l}: link unavailable</div>)
                  : <div key={l} style={{fontSize:13,color:'var(--gray-mid)',marginBottom:6}}>{l}: Not uploaded</div>
              ))}
            </div>
            <div style={{borderTop:'1px solid var(--gray-light)',paddingTop:16}}>
              <h4 style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:12,textTransform:'uppercase',letterSpacing:'0.05em'}}>Update Status</h4>
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                {['pending','processing','complete'].map(s=>(
                  <button key={s} onClick={()=>updateStatus(selected.id,s)} disabled={updating||selected.status===s}
                    style={{padding:'9px 18px',borderRadius:8,border:'none',fontFamily:"'Work Sans',sans-serif",fontSize:14,fontWeight:700,cursor:'pointer',
                      background:selected.status===s?'var(--ink)':'var(--off-white)',
                      color:selected.status===s?'var(--white)':'var(--gray-dark)',
                      opacity:updating?0.6:1}}>
                    {s==='pending'?'Pending':s==='processing'?'In Progress':'Complete'}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      <div className="adm-bar">
        <div><h2>Admin Dashboard</h2><span>Police Check Management · {cnt.total} applications · {staffEmail}</span></div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn-bk" style={{borderColor:'rgba(255,255,255,0.2)',color:'var(--gray-mid)',fontSize:13}} onClick={()=>loadApps()}>↻ Refresh</button>
          <button className="btn-bk" style={{borderColor:'rgba(255,255,255,0.2)',color:'var(--gray-mid)',fontSize:13}} onClick={logout}>Logout</button>
        </div>
      </div>
      <div className="adm-stats">
        <div className="stat-c"><div className="sn">{cnt.total}</div><div className="sl">Total Applications</div></div>
        <div className="stat-c"><div className="sn" style={{color:'var(--success)'}}>{cnt.complete}</div><div className="sl">Completed</div></div>
        <div className="stat-c"><div className="sn" style={{color:'#856404'}}>{cnt.processing}</div><div className="sl">In Progress</div></div>
        <div className="stat-c"><div className="sn" style={{color:'var(--gray-dark)'}}>{cnt.pending}</div><div className="sl">Pending Review</div></div>
      </div>
      <div className="tbl-wrap">
        <div className="tbl-ctrl">
          <input className="ts" placeholder="Search name or reference..." value={sq} onChange={e=>setSq(e.target.value)}/>
          <select className="tf" value={sf} onChange={e=>setSf(e.target.value)}><option value="all">All Statuses</option><option value="complete">Complete</option><option value="processing">In Progress</option><option value="pending">Pending</option></select>
        </div>
        {loading
          ? <div style={{textAlign:'center',padding:40,color:'var(--gray-mid)'}}>Loading applications…</div>
          : <div style={{border:'1px solid var(--gray-light)',borderRadius:'var(--radius)',overflow:'auto'}}>
              <table>
                <thead><tr><th>Applicant</th><th>Reference</th><th>Site</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  {filtered.map(a=>(
                    <tr key={a.id}>
                      <td><div style={{fontWeight:700,color:'var(--ink)'}}>{a.first_name} {a.last_name}</div><div style={{fontSize:12,color:'var(--gray-mid)'}}>{a.email}</div></td>
                      <td><span style={{fontFamily:'monospace',fontSize:12,color:'var(--gray-mid)'}}>{a.reference}</span></td>
                      <td style={{fontSize:13}}>{a.site||'—'}</td>
                      <td style={{fontSize:13}}>{fmtDate(a.created_at)}</td>
                      <td><span className={`sbadge ${a.status}`}>{a.status==='complete'?'Complete':a.status==='processing'?'In Progress':'Pending'}</span></td>
                      <td><button className="abtn" onClick={()=>openDetails(a)}>View</button></td>
                    </tr>
                  ))}
                  {filtered.length===0&&<tr><td colSpan={6} style={{textAlign:'center',padding:28,color:'var(--gray-mid)'}}>No results found.</td></tr>}
                </tbody>
              </table>
            </div>
        }
      </div>
    </div>
  );
}

      id: 'q2',

      question: 'How do you ensure accuracy when handling inventory or orders?',
      hint: 'Tell us about your process for staying precise and avoiding errors',
    },
    {
      id: 'q3',
      num: '03',
      question: 'Tell me about a time you had to meet tight deadlines or handle a high workload.',
      hint: 'Describe the situation, what you did, and the outcome',
    },
    {
      id: 'q4',
      num: '04',
      question: 'Are you comfortable with physical work, such as lifting, standing for long periods, or repetitive tasks?',
      hint: 'Be honest — this helps us match you to the right role',
    },
    {
      id: 'q5',
      num: '05',
      question: 'How do you handle safety procedures and workplace guidelines?',
      hint: 'e.g. how you approach WHS, PPE, hazard reporting',
    },
  ];

  const [answers, setAnswers] = useState({ q1:'', q2:'', q3:'', q4:'', q5:'' });
  const [errs, setErrs] = useState({});
  const [current, setCurrent] = useState(0);
  const [submitting, setSubmitting] = useState(false);

  const updAns = (id, val) => setAnswers(a => ({...a, [id]: val}));

  const validateCurrent = () => {
    const q = QUESTIONS[current];
    if(!answers[q.id].trim()) {
      setErrs(e => ({...e, [q.id]: 'Please provide an answer before continuing'}));
      return false;
    }
    setErrs(e => ({...e, [q.id]: ''}));
    return true;
  };

  const next = () => { if(validateCurrent()) setCurrent(c => c + 1); };
  const back = () => setCurrent(c => c - 1);

  const submit = async () => {
    if(!validateCurrent()) return;
    setSubmitting(true);
    // Small delay for UX feel then redirect to police check
    await new Promise(r => setTimeout(r, 1200));
    setPage('police');
  };

  const progress = ((current) / QUESTIONS.length) * 100;

  return (<>
    <div style={{background:'var(--ink)', padding:'72px 48px 56px'}}>
      <div style={{maxWidth:740, margin:'0 auto'}}>
        <div className="lbl lbl-lt">Pre-Employment</div>
        <div className="h1 h1-lt">Interview Questions</div>
        <p className="sub sub-lt">Please answer each question honestly and in your own words. There are no right or wrong answers — we just want to get to know you better.</p>
      </div>
    </div>

    <div className="sec" style={{background:'var(--white)'}}>
      <div className="inner" style={{maxWidth:740}}>

        {/* Progress */}
        <div style={{marginBottom:40}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--gray-mid)'}}>Question {current+1} of {QUESTIONS.length}</span>
            <span style={{fontSize:13,fontWeight:700,color:'var(--ink)'}}>{Math.round(((current)/QUESTIONS.length)*100)}% complete</span>
          </div>
          <div style={{height:6,background:'var(--gray-light)',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${progress}%`,background:'var(--signal)',borderRadius:3,transition:'width 0.4s ease'}}/>
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            {QUESTIONS.map((q,i) => (
              <div key={q.id} style={{flex:1,height:4,borderRadius:2,background:i<current?'var(--signal)':i===current?'var(--signal-light)':'var(--gray-light)',transition:'background 0.3s'}}/>
            ))}
          </div>
        </div>

        {/* Question Card */}
        <div style={{background:'var(--white)',border:'1px solid var(--gray-light)',borderRadius:8,overflow:'hidden',boxShadow:'var(--shadow-lg)'}}>
          <div style={{background:'var(--ink)',padding:'28px 36px',display:'flex',alignItems:'flex-start',gap:20}}>
            <div style={{width:48,height:48,borderRadius:0,background:'rgba(192,86,33,0.15)',border:'1px solid rgba(192,86,33,0.5)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700,color:'var(--signal-light)'}}>{QUESTIONS[current].num}</span>
            </div>
            <div>
              <h3 style={{color:'var(--white)',fontSize:18,fontWeight:700,lineHeight:1.4,marginBottom:8}}>{QUESTIONS[current].question}</h3>
              <p style={{color:'var(--gray-mid)',fontSize:13}}>{QUESTIONS[current].hint}</p>
            </div>
          </div>

          <div style={{padding:'32px 36px'}}>
            <div className="fgrp">
              <label style={{marginBottom:8,fontSize:13,color:'var(--gray-dark)',fontWeight:500}}>Your answer</label>
              <textarea
                value={answers[QUESTIONS[current].id]}
                onChange={e => updAns(QUESTIONS[current].id, e.target.value)}
                placeholder="Type your answer here..."
                rows={6}
                style={{fontSize:15,lineHeight:1.7,resize:'vertical',minHeight:140}}
                className={errs[QUESTIONS[current].id] ? 'ferr-i' : ''}
              />
              {errs[QUESTIONS[current].id] && <span className="ferr">{errs[QUESTIONS[current].id]}</span>}
            </div>

            {/* Word count */}
            <div style={{textAlign:'right',fontSize:12,color:'var(--gray-mid)',marginTop:6}}>
              {answers[QUESTIONS[current].id].trim().split(/\s+/).filter(Boolean).length} words
            </div>
          </div>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'20px 36px',borderTop:'1px solid var(--gray-light)',background:'var(--off-white)'}}>
            {current > 0
              ? <button className="btn-bk" onClick={back}>← Back</button>
              : <span/>
            }
            {current < QUESTIONS.length - 1
              ? <button className="btn-n" onClick={next}>Next Question →</button>
              : <button className="btn-sub" onClick={submit} disabled={submitting} style={{opacity:submitting?0.7:1}}>
                  {submitting ? 'Submitting… ⏳' : 'Submit & Continue to Police Check →'}
                </button>
            }
          </div>
        </div>

        {/* Question dots nav */}
        <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:28}}>
          {QUESTIONS.map((q,i) => (
            <div key={q.id} style={{
              width: i===current?28:10, height:10, borderRadius:5,
              background: i<current?'var(--signal)':i===current?'var(--ink)':'var(--gray-light)',
              transition:'all 0.3s', cursor: i<current?'pointer':'default'
            }} onClick={() => i<current && setCurrent(i)}/>
          ))}
        </div>

        <p style={{textAlign:'center',fontSize:13,color:'var(--gray-mid)',marginTop:20}}>
          After submitting you'll be directed to complete your National Police Check — this is required for all roles.
        </p>
      </div>
    </div>
  </>);
}

/* ── APPLY NOW (standalone job application page) ── */
function ApplyNow({ setPage }) {
  const [done, setDone] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [submitErr, setSubmitErr] = useState('');
  const [form, setForm] = useState({
    firstName:'', middleName:'', lastName:'', dob:'', gender:'',
    email:'', phone:'', address:'', suburb:'', state:'', postcode:'',
    preferredCity:'', workType:'',
  });
  const [errs, setErrs] = useState({});
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));

  const validate = () => {
    const e = {};
    if(!form.firstName.trim()) e.firstName = 'Required';
    if(!form.lastName.trim()) e.lastName = 'Required';
    if(!form.dob) e.dob = 'Required';
    if(!form.email.includes('@')) e.email = 'Valid email required';
    if(!form.phone.trim()) e.phone = 'Required';
    if(!form.address.trim()) e.address = 'Required';
    if(!form.suburb.trim()) e.suburb = 'Required';
    if(!form.state) e.state = 'Required';
    if(!form.postcode.trim()) e.postcode = 'Required';
    if(!form.preferredCity) e.preferredCity = 'Required';
    if(!form.workType) e.workType = 'Required';
    setErrs(e);
    return Object.keys(e).length === 0;
  };

  const submit = async () => {
    if(!validate()) return;
    setSubmitting(true);
    setSubmitErr('');
    try {
      await sb.insert('job_applications', {
        first_name: form.firstName,
        middle_name: form.middleName,
        last_name: form.lastName,
        dob: form.dob,
        gender: form.gender,
        email: form.email,
        phone: form.phone,
        address: form.address,
        suburb: form.suburb,
        state: form.state,
        postcode: form.postcode,
        preferred_city: form.preferredCity,
        work_type: form.workType,
        status: 'new',
      });
      try {
        await emailjs.send('personnelstaffingaus', 'template_w3e2d1k', {
          name: `${form.firstName} ${form.middleName} ${form.lastName}`.trim(),
          email: form.email,
          phone: form.phone,
          city: form.preferredCity,
          work_type: form.workType,
        });
      } catch(emailErr) { console.warn('Email notification failed:', emailErr); }
      setDone(true);
    } catch(err) {
      console.error(err);
      setSubmitErr('Something went wrong. Please try again or call us on 0470 632 701.');
    } finally {
      setSubmitting(false);
    }
  };

  if(done) return (
    <div className="success-sc" style={{paddingTop:80}}>
      <div className="s-icon">✓</div>
      <h2>Application Received!</h2>
      <p>Thanks for applying! Our team will review your details and be in touch as soon as a suitable role becomes available.</p>
      <p style={{marginTop:8}}>Questions? Call us on <strong>0470 632 701</strong>.</p>
      <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap',marginTop:28}}>
        <button className="btn-n" onClick={()=>{setDone(false);setForm({firstName:'',middleName:'',lastName:'',dob:'',gender:'',email:'',phone:'',address:'',suburb:'',state:'',postcode:'',preferredCity:'',workType:''});}}>Submit Another</button>
        <button className="btn-bk" onClick={()=>setPage('home')}>Return Home</button>
      </div>
    </div>
  );

  return (<>
    <div className="sec" style={{background:'var(--ink)',paddingBottom:64}}>
      <div className="inner">
        <div className="lbl lbl-lt">Now Hiring</div>
        <div className="h1 h1-lt">Apply for a Position</div>
        <p className="sub sub-lt">Fill in your details below and we'll match you with available warehouse and logistics roles across Australia.</p>
      </div>
    </div>

    <div className="sec" style={{background:'var(--white)'}}>
      <div className="inner" style={{maxWidth:780}}>
        <div className="form-wrap">
          <div className="form-hdr">
            <div>
              <h3>Job Application Form</h3>
              <p>All fields marked * are required. Your details are kept private and secure.</p>
            </div>
          </div>
          <div className="form-body">
            <div className="info-b">ℹ️ Enter your details exactly as they appear on your ID.</div>

            <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:14}}>Personal Details</div>
            <div className="fg" style={{marginBottom:20}}>
              <div className="fgrp"><label>First Name <span className="req">*</span></label><input value={form.firstName} onChange={e=>upd('firstName',e.target.value)} className={errs.firstName?'ferr-i':''}/>{errs.firstName&&<span className="ferr">{errs.firstName}</span>}</div>
              <div className="fgrp"><label>Middle Name</label><input value={form.middleName} onChange={e=>upd('middleName',e.target.value)} placeholder="If applicable"/></div>
              <div className="fgrp"><label>Last Name <span className="req">*</span></label><input value={form.lastName} onChange={e=>upd('lastName',e.target.value)} className={errs.lastName?'ferr-i':''}/>{errs.lastName&&<span className="ferr">{errs.lastName}</span>}</div>
              <div className="fgrp"><label>Date of Birth <span className="req">*</span></label><input type="date" value={form.dob} onChange={e=>upd('dob',e.target.value)} className={errs.dob?'ferr-i':''}/>{errs.dob&&<span className="ferr">{errs.dob}</span>}</div>
              <div className="fgrp"><label>Gender</label><select value={form.gender} onChange={e=>upd('gender',e.target.value)}><option value="">Prefer not to say</option>{['Male','Female','Non-binary','Other'].map(g=><option key={g}>{g}</option>)}</select></div>
              <div className="fgrp"><label>Email <span className="req">*</span></label><input type="email" value={form.email} onChange={e=>upd('email',e.target.value)} className={errs.email?'ferr-i':''} placeholder="your@email.com"/>{errs.email&&<span className="ferr">{errs.email}</span>}</div>
              <div className="fgrp"><label>Mobile <span className="req">*</span></label><input type="tel" value={form.phone} onChange={e=>upd('phone',e.target.value)} className={errs.phone?'ferr-i':''} placeholder="04XX XXX XXX"/>{errs.phone&&<span className="ferr">{errs.phone}</span>}</div>
            </div>

            <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:14,paddingTop:16,borderTop:'1px solid var(--gray-light)'}}>Home Address</div>
            <div className="fg" style={{marginBottom:20}}>
              <div className="fgrp fg-full"><label>Street Address <span className="req">*</span></label><input value={form.address} onChange={e=>upd('address',e.target.value)} className={errs.address?'ferr-i':''} placeholder="Street number and name"/>{errs.address&&<span className="ferr">{errs.address}</span>}</div>
              <div className="fgrp"><label>Suburb <span className="req">*</span></label><input value={form.suburb} onChange={e=>upd('suburb',e.target.value)} className={errs.suburb?'ferr-i':''}/>{errs.suburb&&<span className="ferr">{errs.suburb}</span>}</div>
              <div className="fgrp"><label>State <span className="req">*</span></label><select value={form.state} onChange={e=>upd('state',e.target.value)} className={errs.state?'ferr-i':''}><option value="">Select</option>{['NSW','VIC','QLD','WA','SA','TAS','ACT','NT'].map(s=><option key={s}>{s}</option>)}</select>{errs.state&&<span className="ferr">{errs.state}</span>}</div>
              <div className="fgrp"><label>Postcode <span className="req">*</span></label><input value={form.postcode} onChange={e=>upd('postcode',e.target.value)} className={errs.postcode?'ferr-i':''} maxLength={4} placeholder="e.g. 6000"/>{errs.postcode&&<span className="ferr">{errs.postcode}</span>}</div>
            </div>

            <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:14,paddingTop:16,borderTop:'1px solid var(--gray-light)'}}>Work Preferences</div>
            <div className="fg">
              <div className="fgrp">
                <label>Preferred City to Work <span className="req">*</span></label>
                <select value={form.preferredCity} onChange={e=>upd('preferredCity',e.target.value)} className={errs.preferredCity?'ferr-i':''}>
                  <option value="">Select city</option>
                  {['Sydney','Melbourne','Brisbane','Perth','Adelaide','Canberra','Gold Coast','Newcastle','Wollongong','Geelong'].map(c=><option key={c}>{c}</option>)}
                </select>
                {errs.preferredCity&&<span className="ferr">{errs.preferredCity}</span>}
              </div>
              <div className="fgrp">
                <label>Preferred Work Type <span className="req">*</span></label>
                <select value={form.workType} onChange={e=>upd('workType',e.target.value)} className={errs.workType?'ferr-i':''}>
                  <option value="">Select type</option>
                  {['Casual','Part-time','Full-time','Any'].map(t=><option key={t}>{t}</option>)}
                </select>
                {errs.workType&&<span className="ferr">{errs.workType}</span>}
              </div>
            </div>

            {submitErr&&<div style={{background:'var(--error-bg)',border:'1px solid #F5C6CB',borderRadius:'var(--radius-sm)',padding:14,marginTop:16,color:'var(--error)',fontSize:13}}>{submitErr}</div>}
          </div>
          <div className="form-nav">
            <span/>
            <button className="btn-sub" onClick={submit} disabled={submitting} style={{opacity:submitting?0.7:1}}>
              {submitting?'Submitting…':'Submit Application →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  </>);
}

/* ── ROUTER ── */
const ROUTES = {
  '/': 'home',
  '/about': 'about',
  '/services': 'services',
  '/jobs': 'jobs',
  '/apply-now': 'applynow',
  '/interview': 'interview',
  '/apply': 'police',
  '/track': 'police',
  '/admin': 'police',
  '/contact': 'contact',
};

const TAB_ROUTES = {
  '/apply': 'apply',
  '/track': 'track',
  '/admin': 'admin',
};

function getPageFromPath(path) {
  return ROUTES[path] || 'home';
}

function App() {
  const getPath = () => window.location.pathname;
  const [page, setPage] = React.useState(getPageFromPath(getPath()));
  const [policeTab, setPoliceTab] = React.useState(TAB_ROUTES[getPath()] || 'apply');

  const navigate = (p) => {
    const pathMap = { home:'/', about:'/about', services:'/services', jobs:'/jobs', applynow:'/apply-now', interview:'/interview', police:'/apply', contact:'/contact' };
    const path = pathMap[p] || '/';
    window.history.pushState({}, '', path);
    setPage(p);
    if(p === 'police') setPoliceTab('apply');
    window.scrollTo(0, 0);
  };

  const navigateTab = (tab) => {
    const tabPaths = { apply:'/apply', track:'/track', admin:'/admin' };
    window.history.pushState({}, '', tabPaths[tab] || '/apply');
    setPoliceTab(tab);
    window.scrollTo(0, 0);
  };

  React.useEffect(() => {
    const onPop = () => {
      const p = getPath();
      setPage(getPageFromPath(p));
      if(TAB_ROUTES[p]) setPoliceTab(TAB_ROUTES[p]);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const pages = { home:Home, about:About, services:Services, jobs:Jobs, applynow:ApplyNow, interview:Interview, police:Police, contact:Contact };
  const Page = pages[page] || Home;

  return (
    <>
      <Nav page={page} setPage={navigate}/>
      <Page setPage={navigate} policeTab={policeTab} setPoliceTab={navigateTab}/>
      <Footer setPage={navigate}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
